  svg.addEventListener('pointerdown', function(e){
    const handleEl = e.target.closest('.handle');
    if(handleEl){
      const h = handleEl.dataset.handle;
      if(h === 'p1' || h === 'p2') startEndpointDrag(h, e);
      else if(h === 'frontW' || h === 'frontH' || h === 'cylTop' || h === 'arcAngle' || h === 'waterLevel') startAuxHandleDrag(h, e);
      else if(h.indexOf('vertex') === 0) startVertexDrag(+h.slice(6), e);
      else if(h.indexOf('export') === 0) startExportRectDrag(h, e);
      else startHandleDrag(h, e);
      return;
    }
    const shapeEl = e.target.closest('.shape-g');
    if(shapeEl){
      const id = +shapeEl.dataset.id;
      selectShape(id);
      startMoveDrag(e);
      return;
    }
    deselect();
  });

  svg.addEventListener('dblclick', function(e){
    const shapeEl = e.target.closest('.shape-g');
    if(!shapeEl) return;
    const id = +shapeEl.dataset.id;
    const s = shapes.find(sh=>sh.id===id);
    if(!s) return;
    if(s.type === 'label'){ selectShape(id); enterLabelEdit(id); }
  });

  function startMoveDrag(e){
    e.preventDefault();
    const s0 = { ...getSelected() };
    const start = toCanvasCoords(e);
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const cur = toCanvasCoords(ev);
      const s = getSelected(); if(!s) return;
      s.x = s0.x + (cur.x - start.x);
      s.y = s0.y + (cur.y - start.y);
      if(gridMode === 'enforce'){
        if(POINT_TYPES.includes(s.type)) snapCenterBox(s);
        else { s.x = snapVal(s.x); s.y = snapVal(s.y); }
      }
      render();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  function startHandleDrag(handle, e){
    e.preventDefault(); e.stopPropagation();
    const s0 = { ...getSelected() };
    const start = toCanvasCoords(e);
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const s = getSelected(); if(!s) return;
      const cur = toCanvasCoords(ev);
      const dx = cur.x - start.x, dy = cur.y - start.y;

      if(handle === 'rot'){
        const cx = s0.x + s0.w/2, cy = s0.y + s0.h/2;
        let angle = Math.atan2(cur.y-cy, cur.x-cx) * 180/Math.PI + 90;
        if(ev.shiftKey) angle = Math.round(angle/15)*15;
        s.rot = angle;
      } else {
        const [ldx,ldy] = screenDeltaToLocal(dx,dy,s0.rot,s0.flipH,s0.flipV);
        const r = applyResize(handle, s0, ldx, ldy, ev.shiftKey);
        s.x=r.x; s.y=r.y; s.w=r.w; s.h=r.h;
        if(gridMode === 'enforce') snapShapeBox(s);
      }
      render();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  function startEndpointDrag(handle, e){
    e.preventDefault(); e.stopPropagation();
    const s0 = { ...getSelected() };
    const otherLocalX = handle === 'p1' ? s0.w : 0;
    // Snap the fixed (non-dragged) endpoint too, so that once either end
    // of a linear element is touched, the whole thing becomes grid-aligned
    // rather than leaving the other end at its old, possibly off-grid spot.
    const F = snapPoint(localToCanvas(otherLocalX, s0.h/2, s0));
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const s = getSelected(); if(!s) return;
      const D = snapPoint(toCanvasCoords(ev));
      const r = endpointDragUpdate(handle, F, D, s0.h, ev.shiftKey);
      s.x=r.x; s.y=r.y; s.w=r.w; s.rot=r.rot;
      render();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  function startAuxHandleDrag(handle, e){
    e.preventDefault(); e.stopPropagation();
    const s0 = { ...getSelected() };
    const start = toCanvasCoords(e);
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const s = getSelected(); if(!s) return;
      const cur = toCanvasCoords(ev);
      const dx = cur.x - start.x, dy = cur.y - start.y;
      const [ldx,ldy] = screenDeltaToLocal(dx,dy,s0.rot,s0.flipH,s0.flipV);

      if(handle === 'frontW'){
        let fw = s0.w*(s0.frontRatioW||0.72) + ldx;
        fw = Math.min(Math.max(fw, 16), s0.w*0.98);
        s.frontRatioW = fw/s0.w;
      } else if(handle === 'frontH'){
        let fy0 = (s0.h - s0.h*(s0.frontRatioH||0.76)) + ldy;
        fy0 = Math.min(Math.max(fy0, 0), s0.h-16);
        s.frontRatioH = (s0.h - fy0)/s0.h;
      } else if(handle === 'cylTop'){
        let ry = Math.max(s0.h*(s0.ellipseRatio||0.14), 6) + ldy/2;
        ry = Math.min(Math.max(ry, 5), s0.h*0.45);
        s.ellipseRatio = ry/s0.h;
      } else if(handle === 'arcAngle'){
        // Project the cursor onto the actual rendered arc curve so the
        // handle always slides exactly along it.
        const cur = toCanvasCoords(ev);
        let bestDeg = 0, bestDist = Infinity;
        for(let deg=0; deg<=90; deg++){
          const rad = deg*Math.PI/180;
          const lx = s0.w*(1-Math.cos(rad)), ly = s0.h*(1-Math.sin(rad));
          const pt = localToCanvas(lx, ly, s0);
          const dist = (pt.x-cur.x)*(pt.x-cur.x) + (pt.y-cur.y)*(pt.y-cur.y);
          if(dist < bestDist){ bestDist = dist; bestDeg = deg; }
        }
        s.arcAngle = Math.min(Math.max(bestDeg, 5), 90);
      } else if(handle === 'waterLevel'){
        const bt0 = 0.12*s0.h, bb0 = 0.92*s0.h;
        const wl0 = s0.waterLevel==null ? 0.5 : s0.waterLevel;
        let waterY = (bb0 - wl0*(bb0-bt0)) + ldy;
        waterY = Math.min(Math.max(waterY, bt0), bb0);
        s.waterLevel = (bb0-waterY)/(bb0-bt0);
      }
      render();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  function startVertexDrag(idx, e){
    e.preventDefault(); e.stopPropagation();
    const live0 = getSelected();
    const s0 = { ...live0, pts: live0.pts.map(p=>({...p})) };
    const start = toCanvasCoords(e);
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const s = getSelected(); if(!s) return;
      const cur = toCanvasCoords(ev);
      const dx = cur.x - start.x, dy = cur.y - start.y;
      const [ldx,ldy] = screenDeltaToLocal(dx,dy,s0.rot,s0.flipH,s0.flipV);
      const newPts = s0.pts.map(p=>({...p}));
      newPts[idx] = { x: s0.pts[idx].x + ldx, y: s0.pts[idx].y + ldy };
      s.pts = newPts;
      render();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  /* ============================================================
     FLOATING TOOLBAR ACTIONS
     ============================================================ */
  floatToolbar.addEventListener('pointerdown', e=>e.stopPropagation());
  floatToolbar.addEventListener('click', function(e){
    const btn = e.target.closest('button'); if(!btn) return;
    const s = getSelected(); if(!s) return;
    const action = btn.dataset.action;
    if(action === 'flipH') s.flipH *= -1;
    else if(action === 'flipV') s.flipV *= -1;
    else if(action === 'edit'){ enterLabelEdit(s.id); return; }
    else if(action === 'toggleFill'){
      const cycle = s.type === 'rect' ? RECT_FILL_CYCLE : FILL_CYCLE;
      const idx = cycle.indexOf(s.fill || 'none');
      s.fill = cycle[(idx+1) % cycle.length];
    }
    else if(action === 'toggleDotFill'){
      const DOT_COLORS = ['#151515','#ffffff','#cccccc'];
      const idx = DOT_COLORS.indexOf(s.dotFill || '#151515');
      s.dotFill = DOT_COLORS[(idx+1) % DOT_COLORS.length];
    }
    else if(action === 'toggleVF'){
      const VF_MODES = ['out','in','plus','minus'];
      const idx = VF_MODES.indexOf(s.vfMode || 'out');
      s.vfMode = VF_MODES[(idx+1) % VF_MODES.length];
    }
    else if(action === 'toggleArcArrow'){ s.arcArrow = !s.arcArrow; }
    else if(action === 'toggleDash'){
      const cur = s.lineStyle || 'solid';
      s.lineStyle = cur === 'solid' ? 'dashed' : (cur === 'dashed' ? 'white' : 'solid');
    }
    else if(action === 'raise'){ raiseLayer(s.id); return; }
    else if(action === 'lower'){ lowerLayer(s.id); return; }
    else if(action === 'delete'){ shapes = shapes.filter(sh=>sh.id!==s.id); selectedId=null; updateSizeControlUI(); }
    render();
  });

  window.addEventListener('keydown', function(e){
    if(editingId != null) return;
    if((e.key==='Delete' || e.key==='Backspace') && selectedId!=null){
      e.preventDefault();
      shapes = shapes.filter(sh=>sh.id!==selectedId);
      selectedId = null;
      updateSizeControlUI();
      render();
    }
  });

  /* ============================================================
     THICKNESS SLIDER
     ============================================================ */
  thicknessInput.addEventListener('input', function(){
    const s = getSelected();
    if(s && s.type === 'label'){
      s.fontSize = +this.value;
      currentFontSize = s.fontSize;
      thicknessVal.textContent = this.value + 'pt';
      render();
    } else {
      currentStrokeWidth = +this.value;
      thicknessVal.textContent = this.value + 'px';
      if(s){ s.sw = currentStrokeWidth; render(); }
    }
  });

  /* ============================================================
     CUSTOM CONFIRM / MESSAGE DIALOG
     (native confirm()/alert() are blocked in some sandboxed preview
     frames, so this is a self-contained replacement)
     ============================================================ */
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');

  function showConfirm(message, onConfirm){
    confirmMsg.textContent = message;
    confirmCancel.style.display = '';
    confirmOk.textContent = 'OK';
    confirmOverlay.classList.remove('hidden');
    function cleanup(){
      confirmOverlay.classList.add('hidden');
      confirmOk.removeEventListener('click', onOk);
      confirmCancel.removeEventListener('click', onCancel);
    }
    function onOk(){ cleanup(); if(onConfirm) onConfirm(); }
    function onCancel(){ cleanup(); }
    confirmOk.addEventListener('click', onOk);
    confirmCancel.addEventListener('click', onCancel);
  }

  function showMessage(message){
    confirmMsg.textContent = message;
    confirmCancel.style.display = 'none';
    confirmOk.textContent = 'OK';
    confirmOverlay.classList.remove('hidden');
    function cleanup(){
      confirmOverlay.classList.add('hidden');
      confirmOk.removeEventListener('click', onOk);
    }
    function onOk(){ cleanup(); }
    confirmOk.addEventListener('click', onOk);
  }

  /* ============================================================
     CLEAR CANVAS
     ============================================================ */
  document.getElementById('clearBtn').addEventListener('click', function(){
    if(shapes.length===0) return;
    showConfirm('Clear the entire canvas? This cannot be undone.', function(){
      shapes = []; selectedId = null; editingId = null; render();
    });
  });

  /* ============================================================
     SVG SIZING
     ============================================================ */
  function resizeSVG(){
    const r = canvasWrap.getBoundingClientRect();
    svg.setAttribute('width', r.width);
    svg.setAttribute('height', r.height);
    svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
    const MIN = 20;
    if(!exportRect){
      const inset = 8;
      exportRect = { x: inset, y: inset, w: Math.max(r.width-2*inset, MIN), h: Math.max(r.height-2*inset, MIN) };
    } else {
      // Keep the export selection within the (possibly resized) canvas.
      exportRect.x = Math.min(exportRect.x, Math.max(r.width-MIN, 0));
      exportRect.y = Math.min(exportRect.y, Math.max(r.height-MIN, 0));
      exportRect.w = Math.min(exportRect.w, r.width-exportRect.x);
      exportRect.h = Math.min(exportRect.h, r.height-exportRect.y);
    }
    renderExportRect();
  }
  window.addEventListener('resize', ()=>{ resizeSVG(); render(); });

  /* ============================================================
     EXPORT SELECTION RECTANGLE
     A dashed red rectangle the user can resize by its corner handles;
     Save PNG crops the exported image to this region.
     ============================================================ */
  function renderExportRect(){
    if(!exportRect) return;
    const er = exportRect, hs = 7;
    exportRectLayer.innerHTML = `
      <rect x="${er.x}" y="${er.y}" width="${er.w}" height="${er.h}" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="7 5" vector-effect="non-scaling-stroke" pointer-events="none"/>
      <circle class="handle" data-handle="exportNW" cx="${er.x}" cy="${er.y}" r="${hs}" fill="#fff" stroke="#e53935" stroke-width="2.2"/>
      <circle class="handle" data-handle="exportNE" cx="${er.x+er.w}" cy="${er.y}" r="${hs}" fill="#fff" stroke="#e53935" stroke-width="2.2"/>
      <circle class="handle" data-handle="exportSW" cx="${er.x}" cy="${er.y+er.h}" r="${hs}" fill="#fff" stroke="#e53935" stroke-width="2.2"/>
      <circle class="handle" data-handle="exportSE" cx="${er.x+er.w}" cy="${er.y+er.h}" r="${hs}" fill="#fff" stroke="#e53935" stroke-width="2.2"/>
    `;
  }

  function startExportRectDrag(handle, e){
    e.preventDefault(); e.stopPropagation();
    const r0 = { ...exportRect };
    const start = toCanvasCoords(e);
    svg.setPointerCapture(e.pointerId);

    function move(ev){
      const cur = toCanvasCoords(ev);
      const dx = cur.x - start.x, dy = cur.y - start.y;
      let { x, y, w, h } = r0;
      let nx = x, ny = y, nw = w, nh = h;
      switch(handle){
        case 'exportSE': nw = w+dx; nh = h+dy; break;
        case 'exportNW': nw = w-dx; nh = h-dy; nx = x+dx; ny = y+dy; break;
        case 'exportNE': nw = w+dx; nh = h-dy; ny = y+dy; break;
        case 'exportSW': nw = w-dx; nh = h+dy; nx = x+dx; break;
      }
      const MIN = 20;
      if(nw < MIN){ if(handle==='exportNW'||handle==='exportSW') nx -= (MIN-nw); nw = MIN; }
      if(nh < MIN){ if(handle==='exportNW'||handle==='exportNE') ny -= (MIN-nh); nh = MIN; }
      const canvasW = svg.clientWidth, canvasH = svg.clientHeight;
      nx = Math.max(0, Math.min(nx, canvasW-MIN));
      ny = Math.max(0, Math.min(ny, canvasH-MIN));
      nw = Math.min(nw, canvasW-nx);
      nh = Math.min(nh, canvasH-ny);
      exportRect = { x:nx, y:ny, w:nw, h:nh };
      renderExportRect();
    }
    function up(){ cleanup(); }
    function cleanup(){
      svg.removeEventListener('pointermove', move);
      svg.removeEventListener('pointerup', up);
      svg.removeEventListener('pointercancel', cleanup);
      try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
    }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', cleanup);
  }

  // SVG images containing <foreignObject> (used for text labels) taint the
  // canvas when rasterized, which makes canvas.toBlob() throw a
  // SecurityError. To avoid this, replace every foreignObject in the
  // export clone with a plain SVG <text> element instead.
  function replaceForeignObjectsForExport(clone){
    clone.querySelectorAll('foreignObject').forEach(fo => {
      const g = fo.closest('g.shape-g');
      const id = g ? +g.dataset.id : null;
      const s = id != null ? shapes.find(sh=>sh.id===id) : null;
      if(s && s.type === 'label'){
        const fs = s.fontSize || 20;
        const tmp = document.createElement('div');
        tmp.innerHTML = latexLiteToHTML(s.text || '');
        const plainText = tmp.textContent || '';
        const textEl = document.createElementNS('http://www.w3.org/2000/svg','text');
        textEl.setAttribute('font-family','Arial,Helvetica,sans-serif');
        textEl.setAttribute('font-size', fs+'pt');
        textEl.setAttribute('fill', '#151515');
        const lines = plainText.split('\n');
        lines.forEach((line,i)=>{
          const tspan = document.createElementNS('http://www.w3.org/2000/svg','tspan');
          tspan.setAttribute('x','2');
          tspan.setAttribute('dy', i===0 ? `${fs*0.9}` : `${fs*1.25}`);
          tspan.textContent = line;
          textEl.appendChild(tspan);
        });
        fo.parentNode.replaceChild(textEl, fo);
      } else {
        // Anything else (e.g. a label mid-edit, with a <textarea>) is
        // simply dropped so it can't taint the canvas.
        fo.remove();
      }
    });
  }

  /* ============================================================
     PNG EXPORT
     ============================================================ */
  document.getElementById('downloadBtn').addEventListener('click', function(){
    try{
      const w = svg.clientWidth, h = svg.clientHeight;
      const er = exportRect || { x:0, y:0, w, h };
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);

      const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x','0'); bg.setAttribute('y','0');
      bg.setAttribute('width', w); bg.setAttribute('height', h);
      bg.setAttribute('fill', '#ffffff');
      clone.insertBefore(bg, clone.firstChild);

      const handlesEl = clone.querySelector('#handlesLayer');
      if(handlesEl) handlesEl.remove();
      const exportRectEl = clone.querySelector('#exportRectLayer');
      if(exportRectEl) exportRectEl.remove();
      replaceForeignObjectsForExport(clone);

      const svgStr = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function(){
        try{
          const scale = 2;
          const c = document.createElement('canvas');
          c.width = er.w*scale; c.height = er.h*scale;
          const ctx = c.getContext('2d');
          // Crop to the export-selection rectangle (the dashed red box).
          ctx.drawImage(img, er.x, er.y, er.w, er.h, 0, 0, er.w*scale, er.h*scale);
          URL.revokeObjectURL(url);
          c.toBlob(function(pngBlob){
            const dlUrl = URL.createObjectURL(pngBlob);
            let downloaded = false;
            try{
              const link = document.createElement('a');
              link.download = 'physics-diagram.png';
              link.href = dlUrl;
              document.body.appendChild(link);
              link.click();
              link.remove();
              downloaded = true;
            }catch(err){ downloaded = false; }
            // Opening the export in a new tab as a fallback has been
            // disabled — it was unnecessary.
            // const opened = window.open(dlUrl, '_blank');
            if(!downloaded){
              showMessage('Could not start the download automatically. Try opening this page in a full browser tab and downloading again.');
            }
          });
        }catch(err){
          showMessage('Could not export the diagram: ' + err.message);
        }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); showMessage('Could not export the diagram. Try again.'); };
      img.src = url;
    }catch(err){
      showMessage('Could not export the diagram: ' + err.message);
    }
  });

  /* ============================================================
     INIT
     ============================================================ */
  buildToolbar();
  applyGridMode();
  resizeSVG();
  render();
  window.addEventListener('orientationchange', ()=>setTimeout(()=>{resizeSVG(); render();},300));
})();
</script>
