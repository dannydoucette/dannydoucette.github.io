<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ideal Gas Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; color: #000; height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #ffffff; border-bottom: 1px solid #d0d0d0; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    #topbar h1 { font-size: 1.2rem; font-weight: 700; color: #000; font-family: Arial, sans-serif; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #canvas-area { flex: 1; display: flex; flex-direction: column; padding: 14px 0 14px 14px; }
    #zoom-controls { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; background: #ffffff; border: 1px solid #d0d0d0; border-radius: 6px; padding: 8px 10px; }
    #zoom-controls button { background: #f0f0f0; border: 1px solid #bbb; color: #000; border-radius: 5px; padding: 5px 14px; cursor: pointer; font-size: 0.9rem; font-family: Arial, sans-serif; font-weight: 700; transition: background 0.15s; }
    #zoom-controls button:hover { background: #e2e2e2; }
    #zoom-label { font-size: 0.86rem; color: #000; margin-left: 4px; font-family: Arial, sans-serif; }
    #canvas-wrapper { flex: 1; position: relative; overflow: hidden; border-radius: 6px; border: 1px solid #2e3340; background: #fff; }
    canvas#sim { display: block; cursor: grab; }
    canvas#sim:active { cursor: grabbing; }
    #attribution { font-size: 0.82rem; color: #000; line-height: 1.5; text-align: right; font-family: Arial, sans-serif; margin-left: auto; }
    #attribution a { color: #1e4a7a; text-decoration: none; }
    #attribution a:hover { text-decoration: underline; }
    #controls { width: 290px; min-width: 290px; background: #ffffff; border-left: 1px solid #d0d0d0; display: flex; flex-direction: column; overflow-y: auto; padding: 14px; gap: 5px; font-family: Arial, sans-serif; color: #000; }
    .ptitle { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #000; font-weight: 700; margin-bottom: 1px; margin-top: 8px; font-family: Arial, sans-serif; }
    .ptitle:first-child { margin-top: 0; }
    .ctrl { display: flex; flex-direction: column; gap: 4px; background: #f5f5f5; border: 1px solid #d8d8d8; border-radius: 6px; padding: 9px 11px; }
    .clabel { display: flex; justify-content: space-between; align-items: baseline; }
    .clabel span:first-child { font-size: 0.88rem; color: #000; font-family: Arial, sans-serif; }
    .readout { font-size: 0.92rem; font-weight: 700; color: #1e4a7a; font-variant-numeric: tabular-nums; font-family: Arial, sans-serif; }
    input[type=range] { width: 100%; accent-color: #4a7fd4; cursor: pointer; }
    .rrow { display: flex; justify-content: space-between; align-items: center; background: #f5f5f5; border: 1px solid #d8d8d8; border-radius: 6px; padding: 7px 11px; }
    .rrow span:first-child { font-size: 0.88rem; color: #000; font-family: Arial, sans-serif; }
    #gif-section { padding-top: 10px; border-top: 1px solid #d8d8d8; display: flex; flex-direction: column; gap: 6px; }
    .gbtn { padding: 8px; border-radius: 6px; border: none; font-size: 0.86rem; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.15s, opacity 0.15s; font-family: Arial, sans-serif; }
    #btn-record { background: #8b2020; color: #fff; }
    #btn-record:hover { background: #a82828; }
    #btn-record.rec { background: #2d2d2d; color: #f88; border: 1px solid #5a2020; }
    #btn-export { background: #1e4a7a; color: #fff; }
    #btn-export:hover { background: #2860a0; }
    #btn-export:disabled { opacity: 0.3; cursor: not-allowed; }
    #gif-status { font-size: 0.8rem; color: #333; text-align: center; min-height: 1em; font-family: Arial, sans-serif; }
    .gif-meta { display: flex; align-items: center; gap: 6px; font-size: 0.84rem; color: #000; font-family: Arial, sans-serif; }
    .gif-meta input { width: 44px; background: #fff; border: 1px solid #bbb; color: #000; border-radius: 4px; padding: 3px 5px; font-size: 0.84rem; text-align: center; font-family: Arial, sans-serif; }
    #sim-btns { display: flex; gap: 6px; }
    #sim-btns button { flex: 1; padding: 7px; border-radius: 6px; border: 1px solid #bbb; background: #f0f0f0; color: #000; font-size: 0.86rem; font-weight: 700; cursor: pointer; transition: background 0.15s; font-family: Arial, sans-serif; }
    #sim-btns button:hover { background: #e2e2e2; }
    #btn-pause.paused { color: #a05a00; border-color: #c89a4a; }
    #btn-track.active { background: #8b2020; color: #fff; border-color: #8b2020; }
    .mass-labels { display: flex; justify-content: space-between; font-size: 0.74rem; color: #555; font-family: Arial, sans-serif; margin-top: 1px; }
    #pv-graph-wrap { background: #f5f5f5; border: 1px solid #d8d8d8; border-radius: 6px; padding: 8px 10px; }
    #pv-graph-wrap canvas { width: 100%; display: block; }
  </style>
</head>
<body>

<div id="topbar">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none" style="flex-shrink:0">
    <circle cx="13" cy="13" r="12" fill="#1e2530" stroke="#3a4560" stroke-width="1.5"/>
    <circle cx="8" cy="10" r="2.3" fill="#5b9bd5"/><circle cx="17" cy="8" r="2.3" fill="#5b9bd5"/>
    <circle cx="7" cy="17" r="2.3" fill="#5b9bd5"/><circle cx="18" cy="18" r="2.3" fill="#5b9bd5"/>
    <circle cx="13" cy="14" r="2.3" fill="#5b9bd5"/>
  </svg>
  <div>
    <h1 id="page-title">Ideal Gas Simulation (Helium)</h1>
  </div>
</div>

<div id="main">
  <div id="canvas-area">
    <div id="zoom-controls">
      <button onclick="zoom(1.2)">+ Zoom In</button>
      <button onclick="zoom(1/1.2)">- Zoom Out</button>
      <button onclick="resetZoom()">&#x21ba; Reset</button>
      <span id="zoom-label">100%</span>
      <div id="attribution">
        Danny Doucette<br>
        <a href="https://thinkib.net/physics" target="_blank">thinkib.net/physics</a>
      </div>
    </div>
    <div id="canvas-wrapper"><canvas id="sim"></canvas></div>
  </div>

  <div id="controls">
    <div class="ptitle">Simulation</div>
    <div id="sim-btns">
      <button id="btn-pause" onclick="togglePause()">&#x23f8; Pause</button>
      <button onclick="resetSim()">&#x21ba; Reset</button>
      <button id="btn-track" onclick="toggleTrack()">Track</button>
    </div>

    <div class="ptitle">Parameters</div>
    <div class="ctrl">
      <div class="clabel"><span>Particles (mol)</span><span class="readout" id="rd-n">50</span></div>
      <input type="range" id="sl-n" min="1" max="200" value="50" oninput="onNChange(this.value)">
    </div>
    <div class="ctrl">
      <div class="clabel"><span>Volume (m³)</span><span class="readout" id="rd-vol">1.00</span></div>
      <input type="range" id="sl-vol" min="35" max="100" value="60" oninput="onVolChange(this.value)">
    </div>
    <div class="ctrl">
      <div class="clabel"><span>Temperature (K)</span><span class="readout" id="rd-temp">300</span></div>
      <input type="range" id="sl-temp" min="10" max="6000" value="300" oninput="onTempChange(this.value)">
    </div>
    <div class="ctrl">
      <div class="clabel"><span>Gas</span><span class="readout" id="rd-mass">Helium</span></div>
      <input type="range" id="sl-mass" min="0" max="3" step="1" value="1" oninput="onMassChange(this.value)">
      <div class="mass-labels"><span>H</span><span>He</span><span>Ne</span><span>Ar</span></div>
    </div>

    <div class="ptitle">P&ndash;V Diagram</div>
    <div id="pv-graph-wrap">
      <canvas id="pv-graph" width="260" height="160"></canvas>
    </div>

    <div id="gif-section">
      <div class="ptitle" style="margin-top:0">Export GIF</div>
      <div class="gif-meta">
        <label>FPS</label>
        <input type="number" id="gif-fps" value="15" min="1" max="24">
        <label style="margin-left:4px">Sec</label>
        <input type="number" id="gif-dur" value="3" min="1" max="10">
      </div>
      <button class="gbtn" id="btn-record" onclick="toggleRecord()">&#x23fa; Start Recording</button>
      <button class="gbtn" id="btn-export" onclick="exportGif()" disabled>&#x2b07; Download GIF</button>
      <div id="gif-status">Ready to record.</div>
    </div>
  </div>
</div>

<script>

// ── Pure-JS GIF Encoder (no Web Workers) ────────────────────────────────────
// NeuQuant color quantizer
function NeuQuant(pixels, samplefac) {
  const netsize=256,maxnetpos=netsize-1,netbiasshift=4,intbiasshift=16,
    intbias=1<<intbiasshift,gammashift=10,gamma=1<<gammashift,betashift=10,
    beta=intbias>>betashift,betagamma=intbias<<(gammashift-betashift),
    initrad=netsize>>3,radiusbiasshift=6,radiusbias=1<<radiusbiasshift,
    initradius=initrad*radiusbias,radiusdec=30,alphabiasshift=10,
    initalpha=1<<alphabiasshift,radbiasshift=8,radbias=1<<radbiasshift,
    alpharadbshift=alphabiasshift+radbiasshift,alpharadbias=1<<alpharadbshift,
    prime1=499,prime2=491,prime3=487,prime4=503,minpicturebytes=3*prime4;
  let network=[],netindex=new Int32Array(256),bias=new Int32Array(netsize),
    freq=new Int32Array(netsize),radpower=new Int32Array(netsize>>3);
  function init(){for(let i=0;i<netsize;i++){let v=(i<<(netbiasshift+8))/netsize;network[i]=new Float64Array([v,v,v,0]);freq[i]=intbias/netsize;bias[i]=0;}}
  function unbiasnet(){for(let i=0;i<netsize;i++){network[i][0]>>=netbiasshift;network[i][1]>>=netbiasshift;network[i][2]>>=netbiasshift;network[i][3]=i;}}
  function altersingle(alpha,i,b,g,r){network[i][0]-=alpha*(network[i][0]-b)/initalpha;network[i][1]-=alpha*(network[i][1]-g)/initalpha;network[i][2]-=alpha*(network[i][2]-r)/initalpha;}
  function alterneigh(radius,i,b,g,r){let lo=Math.abs(i-radius),hi=Math.min(i+radius,netsize),j=i+1,k=i-1,m=1,p,a;while(j<hi||k>lo){a=radpower[m++];if(j<hi){p=network[j++];p[0]-=a*(p[0]-b)/alpharadbias;p[1]-=a*(p[1]-g)/alpharadbias;p[2]-=a*(p[2]-r)/alpharadbias;}if(k>lo){p=network[k--];p[0]-=a*(p[0]-b)/alpharadbias;p[1]-=a*(p[1]-g)/alpharadbias;p[2]-=a*(p[2]-r)/alpharadbias;}}}
  function contest(b,g,r){let bestd=~(1<<31),bestbiasd=bestd,bestpos=-1,bestbiaspos=bestpos,i,n,dist,biasdist,betafreq;for(i=0;i<netsize;i++){n=network[i];dist=Math.abs(n[0]-b)+Math.abs(n[1]-g)+Math.abs(n[2]-r);if(dist<bestd){bestd=dist;bestpos=i;}biasdist=dist-(bias[i]>>(intbiasshift-netbiasshift));if(biasdist<bestbiasd){bestbiasd=biasdist;bestbiaspos=i;}betafreq=freq[i]>>betashift;freq[i]-=betafreq;bias[i]+=betafreq<<gammashift;}freq[bestpos]+=beta;bias[bestpos]-=betagamma;return bestbiaspos;}
  function inxbuild(){let i,j,p,q,smallpos,smallval,previouscol=0,startpos=0;for(i=0;i<netsize;i++){p=network[i];smallpos=i;smallval=p[1];for(j=i+1;j<netsize;j++){q=network[j];if(q[1]<smallval){smallpos=j;smallval=q[1];}}q=network[smallpos];if(i!=smallpos){j=q[0];q[0]=p[0];p[0]=j;j=q[1];q[1]=p[1];p[1]=j;j=q[2];q[2]=p[2];p[2]=j;j=q[3];q[3]=p[3];p[3]=j;}if(smallval!=previouscol){netindex[previouscol]=(startpos+i)>>1;for(j=previouscol+1;j<smallval;j++)netindex[j]=i;previouscol=smallval;startpos=i;}}netindex[previouscol]=(startpos+maxnetpos)>>1;for(let j=previouscol+1;j<256;j++)netindex[j]=maxnetpos;}
  function inxsearch(b,g,r){let a,p,dist,bestd=1e3,best=-1,i=netindex[g],j=i-1;while(i<netsize||j>=0){if(i<netsize){p=network[i];dist=p[1]-g;if(dist>=bestd)i=netsize;else{i++;if(dist<0)dist=-dist;a=p[0]-b;if(a<0)a=-a;dist+=a;if(dist<bestd){a=p[2]-r;if(a<0)a=-a;dist+=a;if(dist<bestd){bestd=dist;best=p[3];}}}}if(j>=0){p=network[j];dist=g-p[1];if(dist>=bestd)j=-1;else{j--;if(dist<0)dist=-dist;a=p[0]-b;if(a<0)a=-a;dist+=a;if(dist<bestd){a=p[2]-r;if(a<0)a=-a;dist+=a;if(dist<bestd){bestd=dist;best=p[3];}}}}}return best;}
  function learn(){let lengthcount=pixels.length,alphadec=30+(samplefac-1)/3,samplepixels=lengthcount/(3*samplefac),delta=~~(samplepixels/100),alpha=initalpha,radius=initradius,rad=radius>>radiusbiasshift;if(rad<=1)rad=0;for(let i=0;i<rad;i++)radpower[i]=alpha*((rad*rad-i*i)*radbias/(rad*rad));let step;if(lengthcount<minpicturebytes){samplefac=1;step=3;}else if(lengthcount%prime1!==0){step=3*prime1;}else if(lengthcount%prime2!==0){step=3*prime2;}else if(lengthcount%prime3!==0){step=3*prime3;}else{step=3*prime4;}let pix=0,i=0,samplepixels2=~~samplepixels;while(i<samplepixels2){let b=(pixels[pix]&255)<<netbiasshift,g=(pixels[pix+1]&255)<<netbiasshift,r=(pixels[pix+2]&255)<<netbiasshift,j=contest(b,g,r);altersingle(alpha,j,b,g,r);if(rad!==0)alterneigh(rad,j,b,g,r);pix+=step;if(pix>=lengthcount)pix-=lengthcount;i++;if(delta===0)delta=1;if(i%delta===0){alpha-=alpha/alphadec;radius-=radius/radiusdec;rad=radius>>radiusbiasshift;if(rad<=1)rad=0;for(j=0;j<rad;j++)radpower[j]=alpha*((rad*rad-j*j)*radbias/(rad*rad));}}}
  this.buildColormap=function(){init();learn();unbiasnet();inxbuild();};
  this.getColormap=function(){let map=[],index=[];for(let i=0;i<netsize;i++)index[network[i][3]]=i;let k=0;for(let l=0;l<netsize;l++){let j=index[l];map[k++]=network[j][0];map[k++]=network[j][1];map[k++]=network[j][2];}return map;};
  this.lookupRGB=inxsearch;
}

// LZW Encoder
function lzwEncode(width, height, indexedPixels, colorDepth, out) {
  const EOF=-1,BITS=12,HSIZE=5003;
  const masks=[0,1,3,7,15,31,63,127,255,511,1023,2047,4095,8191,16383,32767,65535];
  const initCodeSize=Math.max(2,colorDepth);
  const accum=new Uint8Array(256),htab=new Int32Array(HSIZE),codetab=new Int32Array(HSIZE);
  let cur_accum=0,cur_bits=0,a_count=0,free_ent=0,maxcode,clear_flg=false,g_init_bits,ClearCode,EOFCode;
  let remaining=width*height,curPixel=0,n_bits=0;
  function MAXCODE(nb){return(1<<nb)-1;}
  function char_out(c){accum[a_count++]=c;if(a_count>=254)flush_char();}
  function flush_char(){if(a_count>0){out.push(a_count);for(let i=0;i<a_count;i++)out.push(accum[i]);a_count=0;}}
  function cl_hash(hs){for(let i=0;i<hs;i++)htab[i]=-1;}
  function output(code){cur_accum&=masks[cur_bits];cur_accum=cur_bits>0?cur_accum|(code<<cur_bits):code;cur_bits+=n_bits;while(cur_bits>=8){char_out(cur_accum&255);cur_accum>>=8;cur_bits-=8;}if(free_ent>maxcode||clear_flg){if(clear_flg){maxcode=MAXCODE(n_bits=g_init_bits);clear_flg=false;}else{++n_bits;maxcode=n_bits==BITS?(1<<BITS):MAXCODE(n_bits);}}if(code==EOFCode){while(cur_bits>0){char_out(cur_accum&255);cur_accum>>=8;cur_bits-=8;}flush_char();}}
  function nextPixel(){if(remaining===0)return EOF;--remaining;return indexedPixels[curPixel++]&255;}
  function cl_block(){cl_hash(HSIZE);free_ent=ClearCode+2;clear_flg=true;output(ClearCode);}
  function compress(init_bits){g_init_bits=init_bits;clear_flg=false;n_bits=g_init_bits;maxcode=MAXCODE(n_bits);ClearCode=1<<(init_bits-1);EOFCode=ClearCode+1;free_ent=ClearCode+2;a_count=0;let ent=nextPixel(),hshift=0,fcode;for(fcode=HSIZE;fcode<65536;fcode*=2)++hshift;hshift=8-hshift;let hsize_reg=HSIZE;cl_hash(hsize_reg);output(ClearCode);let c,i,disp;outer:while((c=nextPixel())!=EOF){fcode=(c<<BITS)+ent;i=(c<<hshift)^ent;if(htab[i]===fcode){ent=codetab[i];continue;}else if(htab[i]>=0){disp=hsize_reg-i;if(i===0)disp=1;do{if((i-=disp)<0)i+=hsize_reg;if(htab[i]===fcode){ent=codetab[i];continue outer;}}while(htab[i]>=0);}output(ent,out);ent=c;if(free_ent<(1<<BITS)){codetab[i]=free_ent++;htab[i]=fcode;}else{cl_block();}}output(ent);output(EOFCode);}
  out.push(initCodeSize);
  compress(initCodeSize+1);
  out.push(0);
}

// Write little-endian short
function writeShort(arr, v) { arr.push(v&255, (v>>8)&255); }

// Encode one canvas element into GIF bytes, appended to existing byte array
// If firstFrame=true, writes GIF header + LSD + palette + netscape ext
// Returns the colormap for reuse as globalPalette
function encodeGIFFrame(canvasEl, out, delay, firstFrame, globalPalette) {
  const w=canvasEl.width, h=canvasEl.height;
  const ctx2=canvasEl.getContext('2d');
  const imgData=ctx2.getImageData(0,0,w,h).data;

  // Extract RGB pixels
  const pixels=new Uint8Array(w*h*3);
  for(let i=0,j=0;i<imgData.length;i+=4){pixels[j++]=imgData[i];pixels[j++]=imgData[i+1];pixels[j++]=imgData[i+2];}

  let colorTab;
  let nq;
  if(globalPalette) {
    colorTab=globalPalette;
  } else {
    nq=new NeuQuant(pixels, 10);
    nq.buildColormap();
    colorTab=nq.getColormap();
  }

  // Index pixels
  const indexedPixels=new Uint8Array(w*h);
  if(nq) {
    for(let i=0,j=0;i<w*h;i++,j+=3) indexedPixels[i]=nq.lookupRGB(pixels[j],pixels[j+1],pixels[j+2]);
  } else {
    // find closest in palette
    for(let i=0,j=0;i<w*h;i++,j+=3){
      let best=0,bestD=1e9;
      for(let k=0,p=0;k<256;k++,p+=3){
        const dr=pixels[j]-colorTab[p],dg=pixels[j+1]-colorTab[p+1],db=pixels[j+2]-colorTab[p+2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bestD){bestD=d;best=k;}
      }
      indexedPixels[i]=best;
    }
  }

  if(firstFrame){
    // Header
    for(const c of 'GIF89a') out.push(c.charCodeAt(0));
    // LSD
    writeShort(out,w); writeShort(out,h);
    out.push(0x80|0x70|0x07); // global color table, color res=8, size=256
    out.push(0); out.push(0); // bg, aspect
    // Global palette
    for(let i=0;i<colorTab.length;i++) out.push(colorTab[i]);
    const pad=3*256-colorTab.length;
    for(let i=0;i<pad;i++) out.push(0);
    // Netscape loop extension
    out.push(0x21,0xFF,0x0B);
    for(const c of 'NETSCAPE2.0') out.push(c.charCodeAt(0));
    out.push(3,1); writeShort(out,0); out.push(0);
  }

  // Graphic Control Extension
  const d=Math.round(delay/10);
  out.push(0x21,0xF9,0x04,0x00);
  writeShort(out,d);
  out.push(0,0);

  // Image Descriptor
  out.push(0x2C);
  writeShort(out,0); writeShort(out,0); writeShort(out,w); writeShort(out,h);
  out.push(firstFrame ? 0x00 : 0x00); // use global palette

  // LZW compressed pixel data
  lzwEncode(w, h, indexedPixels, 8, out);

  return colorTab;
}

function encodeGIF(frames, delay) {
  const out=[];
  let palette=null;
  // Build palette from first frame once, reuse for all
  for(let i=0;i<frames.length;i++){
    palette=encodeGIFFrame(frames[i], out, delay, i===0, i>0?palette:null);
  }
  out.push(0x3B); // trailer
  return new Uint8Array(out);
}


// ── Constants ─────────────────────────────────────────────────────────────────
const k_B  = 1.380649e-23;
const PX_M = 1e-8;

// Discrete gas options: mass (kg) + display name. Default index 1 = Helium.
const GASES = [
  { name: 'Hydrogen', mass: 1.7e-27 },
  { name: 'Helium',   mass: 6.7e-27 },
  { name: 'Neon',     mass: 3.3e-26 },
  { name: 'Argon',    mass: 6.6e-26 },
];
let gasIndex = 1; // Helium default
let m_p = GASES[gasIndex].mass;

// Radius scales with the cube root of mass (reads like the particle's "volume"),
// normalized so Argon (the heaviest, original reference gas) keeps the original RADIUS=3.
const RADIUS_REF_MASS = GASES[3].mass; // Argon
const RADIUS_REF = 3;
function massToRadius(m){ return Math.max(1.5, RADIUS_REF * Math.cbrt(m / RADIUS_REF_MASS)); }
let RADIUS = massToRadius(m_p);

// ── State ─────────────────────────────────────────────────────────────────────
let N = 50, boxFrac = 0.60;
let targetTemp = 300; // K — replaces the old targetSpeed slider
let particles = [], paused = false;
let scale = 1, panX = 0, panY = 0;
let dragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};

// Tracking a single particle's path
let tracking = false;
let trackPath = [];
const TRACK_MAX_POINTS = 4000;

// P-V history for the graph
let pvHistory = [];
const PV_MAX_POINTS = 600;
let pressureEMA = 0;
let lastWallImpulse = 0;

const wrapper = document.getElementById('canvas-wrapper');
const canvas  = document.getElementById('sim');
const ctx     = canvas.getContext('2d');
const pvCanvas = document.getElementById('pv-graph');
const pvCtx    = pvCanvas.getContext('2d');
window._gifBlob = null;

// ── Resize ────────────────────────────────────────────────────────────────────
function resizeCanvas() { canvas.width=wrapper.clientWidth; canvas.height=wrapper.clientHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── Box ───────────────────────────────────────────────────────────────────────
function box() {
  const mg=28, w=Math.round((canvas.width-2*mg)*boxFrac), h=Math.round((canvas.height-2*mg)*boxFrac);
  return {x:Math.round((canvas.width-w)/2), y:Math.round((canvas.height-h)/2), w, h};
}

// ── Particles ─────────────────────────────────────────────────────────────────
// Speed (px/s) from temperature: same visual scaling as the original speed slider
// (20-400 px/s range), but now derived from T and mass so v ∝ sqrt(T/m).
const SPEED_T_REF = 300, SPEED_PX_REF = 150;
function speedFromTemp(T){ return SPEED_PX_REF * Math.sqrt((T/SPEED_T_REF) * (GASES[1].mass/m_p)); }
function tempFromSpeed(speed){ return SPEED_T_REF * Math.pow(speed/SPEED_PX_REF,2) * (m_p/GASES[1].mass); }

function randVel(s){const a=Math.random()*2*Math.PI;return{vx:s*Math.cos(a),vy:s*Math.sin(a)};}
function avgSpd(){return particles.length?particles.reduce((s,p)=>s+Math.hypot(p.vx,p.vy),0)/particles.length:0;}
function initParticles(){
  const b=box();particles=[];
  const speed = speedFromTemp(targetTemp);
  for(let i=0;i<N;i++){const v=randVel(speed*(0.7+Math.random()*0.6));particles.push({x:b.x+RADIUS+Math.random()*(b.w-2*RADIUS),y:b.y+RADIUS+Math.random()*(b.h-2*RADIUS),vx:v.vx,vy:v.vy});}
  trackPath = [];
  pvHistory = [];
  pressureEMA = 0;
}
function rescale(spd){const cur=avgSpd();if(cur<1e-6)return;const r=spd/cur;particles.forEach(p=>{p.vx*=r;p.vy*=r;});}

// ── Physics ───────────────────────────────────────────────────────────────────
let lastTs=null;
function step(ts){
  if(!lastTs)lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,1/60);lastTs=ts;
  if(!paused){
    const b=box();
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;});
    lastWallImpulse=0;
    particles.forEach(p=>{
      if(p.x-RADIUS<b.x)      {if(p.vx<0){lastWallImpulse+=Math.abs(p.vx)*2*m_p;p.vx=Math.abs(p.vx);} p.x=b.x+RADIUS;}
      if(p.x+RADIUS>b.x+b.w)  {if(p.vx>0){lastWallImpulse+=Math.abs(p.vx)*2*m_p;p.vx=-Math.abs(p.vx);} p.x=b.x+b.w-RADIUS;}
      if(p.y-RADIUS<b.y)      {if(p.vy<0){lastWallImpulse+=Math.abs(p.vy)*2*m_p;p.vy=Math.abs(p.vy);} p.y=b.y+RADIUS;}
      if(p.y+RADIUS>b.y+b.h)  {if(p.vy>0){lastWallImpulse+=Math.abs(p.vy)*2*m_p;p.vy=-Math.abs(p.vy);} p.y=b.y+b.h-RADIUS;}
    });
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const pi=particles[i],pj=particles[j];
        const dx=pj.x-pi.x,dy=pj.y-pi.y,d=Math.hypot(dx,dy);
        if(d<2*RADIUS&&d>0){
          const nx=dx/d,ny=dy/d,dv=(pi.vx-pj.vx)*nx+(pi.vy-pj.vy)*ny;
          if(dv>0){pi.vx-=dv*nx;pi.vy-=dv*ny;pj.vx+=dv*nx;pj.vy+=dv*ny;}
          const ov=(2*RADIUS-d)/2;pi.x-=nx*ov;pi.y-=ny*ov;pj.x+=nx*ov;pj.y+=ny*ov;
        }
      }
    }
    if(tracking && particles.length){
      trackPath.push({x:particles[0].x, y:particles[0].y});
      if(trackPath.length>TRACK_MAX_POINTS) trackPath.shift();
    }
    updateReadouts();
    updatePVHistory(b, dt);
  }
  draw();
  drawPV();
  requestAnimationFrame(step);
}

// ── P-V tracking ──────────────────────────────────────────────────────────────
function updatePVHistory(b, dt){
  // Pressure from the ideal gas law: P = N k_B T / V
  const vSq=particles.length?particles.reduce((s,p)=>s+p.vx*p.vx+p.vy*p.vy,0)/particles.length:0;
  const T=tempFromSpeed(Math.sqrt(vSq));
  const V = b.w*b.h*PX_M*PX_M;
  const P = V>0 ? (N*k_B*T)/V : 0;
  pvHistory.push({V, P});
  if(pvHistory.length>PV_MAX_POINTS) pvHistory.shift();
}

// ── Readouts ──────────────────────────────────────────────────────────────────
function updateReadouts(){
  if(!particles.length)return;
  const vSq=particles.reduce((s,p)=>s+p.vx*p.vx+p.vy*p.vy,0)/particles.length;
  const T=tempFromSpeed(Math.sqrt(vSq));
  const {w,h}=box(),V=w*h*PX_M*PX_M;
  document.getElementById('rd-vol').textContent=(V).toExponential(3);
  document.getElementById('rd-temp').textContent=T.toFixed(0);
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  const {x:bx,y:by,w:bw,h:bh}=box();
  const refSpeed = speedFromTemp(targetTemp);
  ctx.save();
  ctx.fillStyle='#e8ecf0';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.translate(canvas.width/2+panX,canvas.height/2+panY);
  ctx.scale(scale,scale);
  ctx.translate(-canvas.width/2,-canvas.height/2);
  ctx.fillStyle='#fff';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#2e3a5c';ctx.lineWidth=2.5;ctx.strokeRect(bx,by,bw,bh);

  if(tracking && trackPath.length>1){
    ctx.save();
    ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();
    ctx.beginPath();
    ctx.moveTo(trackPath[0].x, trackPath[0].y);
    for(let i=1;i<trackPath.length;i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
    ctx.strokeStyle='rgba(200,30,30,0.8)';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  }

  particles.forEach((p,idx)=>{
    const spd=Math.hypot(p.vx,p.vy),t=Math.min(spd/(refSpeed*2||1),1),a=0.6+0.4*t;
    const isTracked = tracking && idx===0;
    ctx.beginPath();ctx.arc(p.x,p.y,RADIUS,0,Math.PI*2);
    ctx.fillStyle= isTracked ? `rgba(255,225,225,${a})` : `rgba(235,245,255,${a})`;ctx.fill();
    ctx.strokeStyle= isTracked ? `rgba(200,30,30,${a})` : `rgba(40,95,185,${a})`;ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(p.x-RADIUS*0.3,p.y-RADIUS*0.3,Math.max(0.5,RADIUS*0.28),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a*0.85})`;ctx.fill();
  });
  ctx.restore();
}

// ── P-V Graph ─────────────────────────────────────────────────────────────────
// Fixed axis ranges (not autoscaled), chosen to comfortably cover the typical
// operating range of the sliders (N up to 200, T up to 2000K, V from volume slider).
const PV_VMIN = 0, PV_VMAX = 4.5e-11;   // m^2 (2D "volume")
const PV_PMIN = 0, PV_PMAX = 1.0e-6;    // Pa-equivalent

function drawPV(){
  const W=pvCanvas.width, H=pvCanvas.height;
  pvCtx.clearRect(0,0,W,H);
  pvCtx.fillStyle='#ffffff'; pvCtx.fillRect(0,0,W,H);

  const padL=46, padB=22, padT=8, padR=8;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  function xOf(V){ return padL + (V-PV_VMIN)/(PV_VMAX-PV_VMIN)*plotW; }
  function yOf(P){ return padT + plotH - (P-PV_PMIN)/(PV_PMAX-PV_PMIN)*plotH; }

  // axes
  pvCtx.strokeStyle='#000'; pvCtx.lineWidth=1;
  pvCtx.beginPath();
  pvCtx.moveTo(padL,padT); pvCtx.lineTo(padL,padT+plotH); pvCtx.lineTo(padL+plotW,padT+plotH);
  pvCtx.stroke();

  // tick labels
  pvCtx.fillStyle='#000'; pvCtx.font='9px Arial'; pvCtx.textAlign='right';
  pvCtx.fillText(PV_PMAX.toExponential(1), padL-3, padT+4);
  pvCtx.fillText(PV_PMIN.toExponential(1), padL-3, padT+plotH+3);
  pvCtx.textAlign='center';
  pvCtx.fillText(PV_VMIN.toExponential(1), padL, padT+plotH+14);
  pvCtx.fillText(PV_VMAX.toExponential(1), padL+plotW, padT+plotH+14);

  pvCtx.save();
  pvCtx.translate(11,padT+plotH/2);
  pvCtx.rotate(-Math.PI/2);
  pvCtx.textAlign='center';
  pvCtx.font='10px Arial';
  pvCtx.fillText('Pressure (Pa)',0,0);
  pvCtx.restore();
  pvCtx.textAlign='center';
  pvCtx.font='10px Arial';
  pvCtx.fillText('Volume (m²)', padL+plotW/2, H-3);

  if(pvHistory.length<2) return;

  pvCtx.beginPath();
  pvCtx.strokeStyle='#1e4a7a'; pvCtx.lineWidth=1.5;
  pvHistory.forEach((d,i)=>{
    const x=xOf(d.V), y=yOf(d.P);
    if(i===0) pvCtx.moveTo(x,y); else pvCtx.lineTo(x,y);
  });
  pvCtx.stroke();

  const last=pvHistory[pvHistory.length-1];
  pvCtx.beginPath();
  pvCtx.arc(xOf(last.V), yOf(last.P), 3, 0, Math.PI*2);
  pvCtx.fillStyle='#c81e1e';
  pvCtx.fill();
}

// ── Zoom/Pan ──────────────────────────────────────────────────────────────────
function zoom(f){scale=Math.max(0.2,Math.min(6,scale*f));document.getElementById('zoom-label').textContent=Math.round(scale*100)+'%';}
function resetZoom(){scale=1;panX=0;panY=0;document.getElementById('zoom-label').textContent='100%';}
canvas.addEventListener('mousedown',e=>{dragging=true;dragStart={x:e.clientX,y:e.clientY};panStart={x:panX,y:panY};});
canvas.addEventListener('mousemove',e=>{if(!dragging)return;panX=panStart.x+(e.clientX-dragStart.x);panY=panStart.y+(e.clientY-dragStart.y);});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('mouseleave',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1);},{passive:false});

// ── Controls ──────────────────────────────────────────────────────────────────
function onNChange(v){
  N=parseInt(v);document.getElementById('rd-n').textContent=N;
  const b=box();
  const speed=speedFromTemp(targetTemp);
  while(particles.length<N){const vl=randVel(speed*(0.7+Math.random()*0.6));particles.push({x:b.x+RADIUS+Math.random()*(b.w-2*RADIUS),y:b.y+RADIUS+Math.random()*(b.h-2*RADIUS),...vl});}
  while(particles.length>N)particles.pop();
}
function onVolChange(v){
  boxFrac=parseInt(v)/100;const b=box();
  particles.forEach(p=>{p.x=Math.max(b.x+RADIUS,Math.min(b.x+b.w-RADIUS,p.x));p.y=Math.max(b.y+RADIUS,Math.min(b.y+b.h-RADIUS,p.y));});
}
function onTempChange(v){
  targetTemp=parseInt(v);
  document.getElementById('rd-temp').textContent=targetTemp;
  rescale(speedFromTemp(targetTemp));
  updatePVHistory(box(), 1/60); // recalculate pressure immediately so the P-V graph reflects the new temperature right away
}

// Gas/mass slider: 4 discrete positions. Changing it always restarts the
// simulation from scratch with the new mass and radius, avoiding any issue
// with particles overlapping mid-simulation as the radius changes.
function onMassChange(v){
  gasIndex = Math.max(0, Math.min(3, parseInt(v)));
  const gas = GASES[gasIndex];
  m_p = gas.mass;
  RADIUS = massToRadius(m_p);
  document.getElementById('rd-mass').textContent = gas.name;
  document.getElementById('page-title').textContent = 'Ideal Gas Simulation (' + gas.name + ')';
  resetSim();
}

function toggleTrack(){
  tracking=!tracking;
  const btn=document.getElementById('btn-track');
  btn.classList.toggle('active', tracking);
  if(tracking) trackPath=[];
}

function togglePause(){
  paused=!paused;const btn=document.getElementById('btn-pause');
  btn.textContent=paused?'\u25b6 Resume':'\u23f8 Pause';btn.classList.toggle('paused',paused);
}
function resetSim(){paused=false;document.getElementById('btn-pause').textContent='\u23f8 Pause';document.getElementById('btn-pause').classList.remove('paused');initParticles();}

// ── GIF Recording — pure synchronous, no workers ──────────────────────────────
let recording=false, recordFrames=[], recordInterval=null;

function toggleRecord(){ recording ? stopRecording() : startRecording(); }

function startRecording(){
  const fps=Math.max(1,Math.min(24,parseInt(document.getElementById('gif-fps').value)||10));
  const dur=Math.max(1,Math.min(10,parseInt(document.getElementById('gif-dur').value)||3));
  const total=fps*dur;
  recording=true; recordFrames=[]; window._gifBlob=null;
  document.getElementById('btn-record').textContent='\u23f9 Stop Recording';
  document.getElementById('btn-record').classList.add('rec');
  document.getElementById('btn-export').disabled=true;
  document.getElementById('gif-status').textContent='Recording\u2026 0/'+total+' frames';
  let count=0;
  b=box();
  recordInterval=setInterval(()=>{
    // Snapshot: draw current frame onto a fresh same-size canvas
    const tmp=document.createElement('canvas');
    tmp.width=b.w; tmp.height=b.h;
    //tmp.width=canvas.width; tmp.height=canvas.height;
    tmp.getContext('2d').drawImage(canvas,-b.x,-b.y);
    recordFrames.push(tmp);
    count++;
    document.getElementById('gif-status').textContent='Recording\u2026 '+count+'/'+total+' frames';
    if(count>=total) stopRecording();
  }, Math.round(1000/fps));
}

function stopRecording(){
  clearInterval(recordInterval); recording=false;
  document.getElementById('btn-record').textContent='\u23fa Start Recording';
  document.getElementById('btn-record').classList.remove('rec');
  if(!recordFrames.length){document.getElementById('gif-status').textContent='No frames captured.';return;}
  encodeGif();
}

function encodeGif(){
  const fps=Math.max(1,Math.min(24,parseInt(document.getElementById('gif-fps').value)||10));
  const delay=Math.round(1000/fps);
  const n=recordFrames.length;
  document.getElementById('gif-status').textContent='Encoding '+n+' frames\u2026';

  // Yield to browser so status text updates, then encode synchronously
  setTimeout(()=>{
    try {
      const bytes=encodeGIF(recordFrames, delay);
      window._gifBlob=new Blob([bytes],{type:'image/gif'});
      document.getElementById('btn-export').disabled=false;
      document.getElementById('gif-status').textContent='\u2713 Ready ('+(window._gifBlob.size/1024).toFixed(0)+' KB) \u2014 click Download.';
    } catch(e) {
      document.getElementById('gif-status').textContent='Error: '+e.message;
      console.error(e);
    }
  }, 50);
}

function exportGif(){
  if(!window._gifBlob)return;
  const url=URL.createObjectURL(window._gifBlob);
  const a=document.createElement('a');a.href=url;a.download='ideal_gas_simulation.gif';a.click();
  URL.revokeObjectURL(url);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initParticles();
requestAnimationFrame(step);
</script>
