<!DOCTYPE html>
<html>

<head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<script src="navigation.js"></script>
</head>

<body><div class="contentBox" id="contentBox">
        <h1>Dynamic Resources</h1>
        <p></p>

        <script type="text/javascript" src="https://www.geogebra.org/apps/deployggb.js"></script>

        <script type="text/javascript">
              
			  var parameters = {
                        "width":800,
                        "height":420,
                        "prerelease":false,
                        "showToolBar":false,
                        "borderColor":null,
                        "showMenuBar":false,
                        "showAlgebraInput":false,
                        "showResetIcon":true,
                        "enableLabelDrags":false,
                        "enableShiftDragZoom":false,
                        "enableRightClick":false,
                        "capturingThreshold":null,
                        "showToolBarHelp":false,
                        "errorDialogsActive":true,
                        "useBrowserForJS":false,
				  // load by filename
                        "filename": "Angular Kinematics.ggb"};
                var applet = new GGBApplet(parameters, true);
              //  when used with Math Apps Bundle, uncomment this:
              //  applet.setHTML5Codebase('GeoGebra/HTML5/5.0/web/');

                window.onload = function() { 
					applet.inject(applet_container);
					}
				

        </script>
		
		<p>
			<h5>Circles of a Triangle</h5>
		<div class="text">A simulation of angular kinematics.</div>
		<div id="applet_container"></div>
		</p>
		
	
</div>
</body>

</html>
