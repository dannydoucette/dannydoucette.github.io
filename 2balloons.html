
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; }
canvas { display: block; }
</style>
<canvas id="simCanvas"></canvas>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const g = 9.8;
const k = 8.99e9;
const q = 200e-9;
const mass = 0.002;

let W, H, BAR_Y, BAR_X1, BAR_X2, STRING_L, BALLOON_R, pxPerMeter;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  BAR_Y = Math.round(H * 0.1);
  BAR_X1 = Math.round(W * 0.08);
  BAR_X2 = Math.round(W * 0.92);
  STRING_L = Math.round(H * 0.52);
  BALLOON_R = Math.round(Math.min(W, H) * 0.055);
  pxPerMeter = Math.round(H * 1.5);
  anchor1 = Math.round(W * 0.38);
  anchor2 = Math.round(W * 0.62);
  computeEquilibrium();
  draw();
}

let anchor1, anchor2;
let bx1, by1, bx2, by2;

let isDark = false;
function getTheme() {
  isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function computeEquilibrium() {
  const anchorSepM = (anchor2 - anchor1) / pxPerMeter;
  let lo = 0, hi = Math.PI / 2 - 0.0001;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const sepM = Math.max(anchorSepM + 2 * (STRING_L / pxPerMeter) * Math.sin(mid), 0.001);
    const F = k * q * q / (sepM * sepM);
    if (Math.tan(mid) < F / (mass * g)) lo = mid;
    else hi = mid;
  }
  const theta = (lo + hi) / 2;
  bx1 = anchor1 - STRING_L * Math.sin(theta);
  bx2 = anchor2 + STRING_L * Math.sin(theta);
  by1 = by2 = BAR_Y + STRING_L * Math.cos(theta);
}

let dragging = null;

canvas.addEventListener('mousedown', e => {
  const mx = e.clientX, my = e.clientY;
  if (Math.sqrt((mx-anchor1)**2+(my-BAR_Y)**2) < 20) { dragging = 'a1'; return; }
  if (Math.sqrt((mx-anchor2)**2+(my-BAR_Y)**2) < 20) { dragging = 'a2'; return; }
});

canvas.addEventListener('mousemove', e => {
  const mx = e.clientX;
  if (!dragging) return;
  if (dragging === 'a1') { anchor1 = Math.max(BAR_X1+30, Math.min(anchor2-10, mx)); computeEquilibrium(); draw(); }
  if (dragging === 'a2') { anchor2 = Math.max(anchor1+10, Math.min(BAR_X2-30, mx)); computeEquilibrium(); draw(); }
});

canvas.addEventListener('mouseup', () => { dragging = null; });

function draw() {
  getTheme();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = isDark ? '#151515' : '#f8f7f3';
  ctx.fillRect(0, 0, W, H);

  const barCol = isDark ? '#888' : '#8B7355';
  ctx.strokeStyle = barCol;
  ctx.lineWidth = Math.round(H * 0.016);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(BAR_X1, BAR_Y); ctx.lineTo(BAR_X2, BAR_Y); ctx.stroke();

  const hatchStep = Math.round(W * 0.025);
  for (let x = BAR_X1; x <= BAR_X2; x += hatchStep) {
    ctx.strokeStyle = barCol;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, BAR_Y - H*0.013); ctx.lineTo(x + hatchStep*0.5, BAR_Y + H*0.013); ctx.stroke();
  }

  ctx.strokeStyle = isDark ? '#9E7B5A' : '#7B5E3A';
  ctx.lineWidth = Math.round(H * 0.004);
  ctx.beginPath(); ctx.moveTo(anchor1, BAR_Y); ctx.lineTo(bx1, by1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(anchor2, BAR_Y); ctx.lineTo(bx2, by2); ctx.stroke();

  const borderCol = isDark ? '#555' : '#aaa';
  ctx.fillStyle = borderCol;
  ctx.beginPath(); ctx.arc(anchor1, BAR_Y, 7, 0, 2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(anchor2, BAR_Y, 7, 0, 2*Math.PI); ctx.fill();

  function drawBalloon(bx, by) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(bx, by, BALLOON_R, 0, 2*Math.PI);
    ctx.fillStyle = '#FF6B6B';
    ctx.fill();
    ctx.strokeStyle = '#FF4444';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(bx - BALLOON_R*0.3, by - BALLOON_R*0.3, BALLOON_R*0.3, 0, 2*Math.PI);
    ctx.fill();
    const nw = BALLOON_R * 0.15, nh = BALLOON_R * 0.22;
    ctx.beginPath();
    ctx.moveTo(bx - nw, by + BALLOON_R);
    ctx.lineTo(bx + nw, by + BALLOON_R);
    ctx.lineTo(bx + nw*0.5, by + BALLOON_R + nh);
    ctx.lineTo(bx - nw*0.5, by + BALLOON_R + nh);
    ctx.fillStyle = '#FF4444';
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.round(BALLOON_R * 0.55)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', bx, by);
    ctx.restore();
  }

  drawBalloon(bx1, by1);
  drawBalloon(bx2, by2);
}

window.addEventListener('resize', resize);
resize();
</script>
